spring.application.name=restaurant-order
server.address=127.0.0.1
server.port=${BACKEND_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:54329}/${POSTGRES_DB:restaurant_order}
spring.datasource.username=${POSTGRES_USER:restaurant_app}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never

# In-memory server sessions: restart requires sign-in again; credentials stay in PostgreSQL.
server.servlet.session.timeout=${STAFF_SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
