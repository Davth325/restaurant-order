name: restaurant-order

services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/Initialize-Dev.ps1 first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/Initialize-Dev.ps1 first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/Initialize-Dev.ps1 first}
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
