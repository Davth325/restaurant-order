name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Install npm and frontend dependencies
        run: |
          npm install --global npm@11.19.0
          npm --prefix frontend ci
      - name: Check and build frontend
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
      - name: Build backend and test with PostgreSQL containers
        working-directory: backend
        run: bash ./gradlew --no-daemon clean build
      - name: Install Chromium headless shell
        timeout-minutes: 5
        run: npm --prefix frontend exec -- playwright install --only-shell chromium
      - name: Prepare demo environment
        shell: pwsh
        run: ./scripts/Initialize-Dev.ps1
      - name: Run packaged demo
        run: |
          set -a
          source .env
          set +a
          docker compose --env-file .env -f infra/compose.yaml up -d --wait --wait-timeout 90
          java -jar backend/build/libs/restaurant-order.jar > .work-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health; then exit 0; fi
            sleep 1
          done
          cat .work-preview.log
          exit 1
      - name: Verify browser flow
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npm --prefix frontend run test:e2e
      - name: Stop demo database
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down
